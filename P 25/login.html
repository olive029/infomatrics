<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infomatrics - Login</title>
    <style>
        /* Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f9f9f9;
            color: #333;
            line-height: 1.6;
        }

        /* Header Styles - Matching Dashboard */
        header {
            background-color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .logo-container {
            display: flex;
            flex-direction: column;
        }

        .logo {
            color: #2e8b57; /* Green color - matching dashboard */
            font-size: 2rem;
            font-weight: bold;
        }

        .tagline {
            color: #666;
            font-size: 0.9rem;
        }

        /* Login Container - Matching Dashboard Card Style */
        .login-container {
            max-width: 450px;
            margin: 3rem auto;
            padding: 2rem;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-header h2 {
            color: #2e8b57;
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }

        .login-header p {
            color: #666;
        }

        /* Form Styles - Matching Dashboard Inputs */
        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #555;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 1rem;
        }

        .form-group input:focus {
            outline: none;
            border-color: #2e8b57;
        }

        /* Button Styles - Matching Dashboard */
        .btn {
            display: inline-block;
            padding: 0.8rem 1.5rem;
            background-color: #2e8b57;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            transition: background-color 0.3s;
        }

        .btn:hover {
            background-color: #267349;
        }

        .btn-block {
            display: block;
            width: 100%;
        }

        /* Additional Options - Matching Dashboard Links */
        .login-options {
            margin-top: 1.5rem;
            text-align: center;
        }

        .login-options a {
            color: #2e8b57;
            text-decoration: none;
        }

        .login-options a:hover {
            text-decoration: underline;
        }

        .divider {
            margin: 1.5rem 0;
            text-align: center;
            position: relative;
            color: #999;
        }

        .divider::before,
        .divider::after {
            content: "";
            position: absolute;
            top: 50%;
            width: 45%;
            height: 1px;
            background-color: #eee;
        }

        .divider::before {
            left: 0;
        }

        .divider::after {
            right: 0;
        }

        /* Footer - Matching Dashboard */
        footer {
            background-color: #2e8b57;
            color: white;
            text-align: center;
            padding: 1.5rem;
            margin-top: 2rem;
        }

        .footer-links {
            margin-top: 1rem;
        }

        .footer-links a {
            color: white;
            margin: 0 0.5rem;
            text-decoration: none;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }

        /* Error message styling */
        .error-message {
            color: #d9534f;
            font-size: 0.9rem;
            margin-top: 0.5rem;
            display: none;
        }

        /* Password strength meter styles */
        .password-strength {
            margin-top: 0.5rem;
            height: 5px;
            background-color: #eee;
            border-radius: 3px;
            overflow: hidden;
        }

        .strength-meter {
            height: 100%;
            width: 0;
            transition: width 0.3s, background-color 0.3s;
        }

        .strength-weak { background-color: #ff4d4d; }
        .strength-medium { background-color: #ffa64d; }
        .strength-strong { background-color: #2e8b57; }

        .strength-text {
            font-size: 0.8rem;
            color: #666;
            margin-top: 0.3rem;
        }

        /* Remember me checkbox styles */
        .remember-me {
            display: flex;
            align-items: center;
            margin: 1rem 0;
        }

        .remember-me input {
            width: auto;
            margin-right: 0.5rem;
        }

        .remember-me label {
            margin-bottom: 0;
            color: #555;
            font-size: 0.9rem;
        }

        /* Responsive Design - Matching Dashboard */
        @media (max-width: 768px) {
            .login-container {
                margin: 2rem 1rem;
                padding: 1.5rem;
            }

            header {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo-container">
            <h1 class="logo">INFOMATRICS</h1>
            <p class="tagline">Your Civic Education Companion</p>
        </div>
    </header>

    <div class="login-container">
        <div class="login-header">
            <h2>Welcome Back</h2>
            <p>Login to access your civic education resources</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required>
                <div id="emailError" class="error-message">Please enter a valid email address</div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required minlength="6">
                <div class="password-strength">
                    <div id="strengthMeter" class="strength-meter"></div>
                </div>
                <div id="strengthText" class="strength-text"></div>
                <div id="passwordError" class="error-message">Password must be at least 6 characters</div>
            </div>

            <div class="remember-me">
                <input type="checkbox" id="rememberMe">
                <label for="rememberMe">Remember me</label>
            </div>

            <button type="submit" class="btn btn-block">Login</button>

            <div class="login-options">
                <a href="#" id="forgotPassword">Forgot password?</a>
            </div>

            <div class="divider">or</div>

            <a href="signup.html" class="btn btn-block" style="background-color: #f0f0f0; color: #333;">Create New Account</a>
        </form>
    </div>

    <footer>
        <p>&copy; 2025 Infomatrics. All rights reserved.</p>
        <div class="footer-links">
            <a href="#">About Us</a>
            <a href="#">Contact</a>
            <a href="#">Privacy Policy</a>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const loginForm = document.getElementById('loginForm');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const emailError = document.getElementById('emailError');
            const passwordError = document.getElementById('passwordError');
            const forgotPasswordLink = document.getElementById('forgotPassword');
            const rememberMe = document.getElementById('rememberMe');
            const strengthMeter = document.getElementById('strengthMeter');
            const strengthText = document.getElementById('strengthText');

            // Initialize database with 5 default users (with stronger passwords)
            function initializeDatabase() {
                if (!localStorage.getItem('userDatabase')) {
                    const defaultUsers = [
                        { id: 1, email: 'user1@example.com', password: 'SecurePass1!', name: 'User One' },
                        { id: 2, email: 'user2@example.com', password: 'StrongPwd2@', name: 'User Two' },
                        { id: 3, email: 'user3@example.com', password: 'Complex3#Pass', name: 'User Three' },
                        { id: 4, email: 'user4@example.com', password: 'Safe4$Word', name: 'User Four' },
                        { id: 5, email: 'user5@example.com', password: 'Good5^Password', name: 'User Five' }
                    ];
                    localStorage.setItem('userDatabase', JSON.stringify(defaultUsers));
                }
            }

            // Password strength checker
            function checkPasswordStrength(password) {
                let strength = 0;
                
                // Length check
                if (password.length >= 8) strength += 1;
                if (password.length >= 12) strength += 1;
                
                // Character variety
                if (/[A-Z]/.test(password)) strength += 1; // Uppercase
                if (/[a-z]/.test(password)) strength += 1; // Lowercase
                if (/[0-9]/.test(password)) strength += 1; // Numbers
                if (/[^A-Za-z0-9]/.test(password)) strength += 1; // Special chars
                
                return strength;
            }

            // Update password strength meter in real-time
            passwordInput.addEventListener('input', function() {
                const password = passwordInput.value;
                const strength = checkPasswordStrength(password);
                
                // Update meter and text
                if (password.length === 0) {
                    strengthMeter.style.width = '0%';
                    strengthText.textContent = '';
                } else {
                    let width = 0;
                    let text = '';
                    let className = '';
                    
                    if (strength <= 2) {
                        width = 33;
                        text = 'Weak';
                        className = 'strength-weak';
                    } else if (strength <= 4) {
                        width = 66;
                        text = 'Medium';
                        className = 'strength-medium';
                    } else {
                        width = 100;
                        text = 'Strong';
                        className = 'strength-strong';
                    }
                    
                    strengthMeter.style.width = width + '%';
                    strengthMeter.className = 'strength-meter ' + className;
                    strengthText.textContent = 'Strength: ' + text;
                }
            });

            // Check for remembered credentials
            function checkRememberedCredentials() {
                const rememberedEmail = localStorage.getItem('rememberedEmail');
                const rememberedPassword = localStorage.getItem('rememberedPassword');
                
                if (rememberedEmail && rememberedPassword) {
                    emailInput.value = rememberedEmail;
                    passwordInput.value = rememberedPassword;
                    rememberMe.checked = true;
                }
            }

            // Find user by email
            function findUserByEmail(email) {
                const users = JSON.parse(localStorage.getItem('userDatabase')) || [];
                return users.find(user => user.email === email);
            }

            // Verify credentials
            function verifyCredentials(email, password) {
                const user = findUserByEmail(email);
                if (user && user.password === password) {
                    return user;
                }
                return null;
            }

            // Form submission
            loginForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                // Reset errors
                emailError.style.display = 'none';
                passwordError.style.display = 'none';
                
                let isValid = true;
                
                // Validate email
                if (!emailInput.value || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailInput.value)) {
                    emailError.style.display = 'block';
                    isValid = false;
                }
                
                // Validate password
                if (!passwordInput.value || passwordInput.value.length < 6) {
                    passwordError.style.display = 'block';
                    isValid = false;
                }
                
                if (isValid) {
                    const user = verifyCredentials(emailInput.value, passwordInput.value);
                    
                    if (user) {
                        // Handle remember me
                        if (rememberMe.checked) {
                            localStorage.setItem('rememberedEmail', emailInput.value);
                            localStorage.setItem('rememberedPassword', passwordInput.value);
                        } else {
                            localStorage.removeItem('rememberedEmail');
                            localStorage.removeItem('rememberedPassword');
                        }
                        
                        // Store session
                        localStorage.setItem('isAuthenticated', 'true');
                        localStorage.setItem('userEmail', user.email);
                        localStorage.setItem('userName', user.name);
                        localStorage.setItem('userId', user.id);
                        
                        // Redirect
                        window.location.href = 'dashboard.html';
                    } else {
                        alert('Invalid email or password. Please try again.');
                    }
                }
            });

            // Forgot password
            forgotPasswordLink.addEventListener('click', function(e) {
                e.preventDefault();
                const email = prompt('Please enter your email address to reset your password:');
                if (email) {
                    const user = findUserByEmail(email);
                    if (user) {
                        alert(`Password reset instructions have been sent to ${email} (simulated)`);
                    } else {
                        alert('No account found with that email address.');
                    }
                }
            });

            // Check if already logged in
            if (localStorage.getItem('isAuthenticated')) {
                const continueAs = confirm(`You're logged in as ${localStorage.getItem('userEmail')}. Continue to dashboard?`);
                if (continueAs) {
                    window.location.href = 'dashboard.html';
                } else {
                    // Clear session but keep remembered credentials if "remember me" was checked
                    localStorage.removeItem('isAuthenticated');
                    localStorage.removeItem('userEmail');
                    localStorage.removeItem('userName');
                    localStorage.removeItem('userId');
                }
            }

            // Initialize database and check remembered credentials
            initializeDatabase();
            checkRememberedCredentials();
        });
    </script>
</body>
</html>
